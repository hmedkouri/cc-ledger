name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints are platform-independent, so they run once rather than
  # once per matrix leg.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Release, because the timing budgets in tests/timing.rs are profile-aware:
  # in debug they fall back to loose bounds and stop guarding anything.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -- --nocapture

  # The floor declared in Cargo.toml. Measured, not chosen: 1.86 fails on
  # `unsigned_is_multiple_of` in src/render.rs.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # Advisories, plus the bans that keep the tree free of anything network-facing.
  # cargo audit alone would report vulnerabilities in existing dependencies while
  # staying green on a PR that added an HTTP client; see deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans advisories sources
